name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Собрать APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PowderAndBanners.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PowderAndBanners-apk
          path: PowderAndBanners.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Порох и Знамёна, сборка ${{ github.run_number }}
          body: Скачайте PowderAndBanners.apk ниже и установите на телефон.
          files: PowderAndBanners.apk
          make_latest: true

  screens:
    # Проверка: ставим APK на эмулятор, запускаем меню и бой на автопилоте, снимаем экраны.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PowderAndBanners-apk

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Эмулятор и снимки экрана
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p shots
            adb install -r PowderAndBanners.apk
            adb shell am start -n ru.argeda.powder/.MainActivity
            sleep 15
            adb exec-out screencap -p > shots/1-menu.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei start 1 --ez autopilot true --ei speed 3
            sleep 25
            adb exec-out screencap -p > shots/2-start.png
            sleep 90
            adb exec-out screencap -p > shots/3-base.png
            sleep 120
            adb exec-out screencap -p > shots/4-later.png
            sleep 120
            adb exec-out screencap -p > shots/5-battle.png
            adb shell dumpsys gfxinfo ru.argeda.powder > shots/gfxinfo.txt || true
            adb logcat -d > shots/logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots
