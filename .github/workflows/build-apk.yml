name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Собрать APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PowderAndBanners.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PowderAndBanners-apk
          path: PowderAndBanners.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Порох и Знамёна, сборка ${{ github.run_number }}
          body: Скачайте PowderAndBanners.apk ниже и установите на телефон.
          files: PowderAndBanners.apk
          make_latest: true
