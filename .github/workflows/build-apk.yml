name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Собрать APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PowderAndBanners.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PowderAndBanners-apk
          path: PowderAndBanners.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Порох и Знамёна, сборка ${{ github.run_number }}
          body: Скачайте PowderAndBanners.apk ниже и установите на телефон.
          files: PowderAndBanners.apk
          make_latest: true

  screens:
    # Проверка: ставим APK на эмулятор, запускаем меню и бой на автопилоте, снимаем экраны.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PowderAndBanners-apk

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Эмулятор и снимки экрана
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p shots
            adb install -r PowderAndBanners.apk
            adb shell am start -n ru.argeda.powder/.MainActivity
            sleep 2
            adb exec-out screencap -p > shots/0-splash.png
            sleep 20
            adb exec-out screencap -p > shots/1-menu.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei start 1 --ez autopilot true --ei speed 3
            sleep 25
            adb exec-out screencap -p > shots/2-start.png
            sleep 90
            adb exec-out screencap -p > shots/3-base.png
            sleep 120
            adb exec-out screencap -p > shots/4-later.png
            sleep 120
            adb exec-out screencap -p > shots/5-battle.png
            adb shell dumpsys gfxinfo ru.argeda.powder > shots/gfxinfo.txt || true
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei start 1 --ez autopilot true --ei speed 3 --ef yaw 0.8 --ef zoom 1.6
            sleep 60
            adb exec-out screencap -p > shots/6-rotated.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei start 1 --ez autopilot true --ei speed 3 --ez gfx2d true
            sleep 40
            adb exec-out screencap -p > shots/7-2d.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei start 1 --ei speed 1 --ez walls true --ef zoom 1.25 --ef yaw 0.35
            sleep 20
            adb exec-out screencap -p > shots/8-walls.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei start 1 --ei speed 1 --ez walls true --ef zoom 1.25 --ez gfx2d true
            sleep 20
            adb exec-out screencap -p > shots/9-walls-2d.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei start 1 --ei speed 1 --ez upgrades true --ef zoom 1.3 --ef yaw 0.3
            sleep 14
            adb exec-out screencap -p > shots/10-upgrades.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei start 1 --ei speed 1 --ez troops true --ef zoom 1.35 --ef yaw 0.3
            sleep 13
            adb exec-out screencap -p > shots/11-troops.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei start 1 --ei speed 1 --ez troops true --ef zoom 1.35 --ez gfx2d true
            sleep 13
            adb exec-out screencap -p > shots/12-troops-2d.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei oldbuild 1
            sleep 25
            adb exec-out screencap -p > shots/13-update.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ez campaign true
            sleep 22
            adb exec-out screencap -p > shots/14-campaign.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei mission 3 --ei speed 1
            sleep 30
            adb exec-out screencap -p > shots/15-mission.png
            adb shell am force-stop ru.argeda.powder
            adb shell am start -n ru.argeda.powder/.MainActivity --ei mission 1 --ei speed 3
            sleep 45
            adb exec-out screencap -p > shots/16-mission-hold.png
            adb logcat -d > shots/logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots

      - name: Сохранить снимки в ветку ci-screens
        if: always()
        run: |
          cd shots
          git init -q
          git checkout -q -b ci-screens
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Снимки сборки ${{ github.run_number }}"
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ci-screens
